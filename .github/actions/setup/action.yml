name: Set up the toolchain
description: Python and Poetry, for the fast and the full command of ci.yml

inputs:
  python-version:
    description: Python version
    default: "3.15"

runs:
  using: composite
  steps:
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
      with:
        python-version: ${{ inputs.python-version }}

    - uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263 # v1
      with:
        virtualenvs-create: true
        virtualenvs-in-project: true
