# Two-tier CI for a GitHub project, written by `ci init`.
#
# A pull request runs the light jobs only: the fast command of the project, the
# commit subjects and the form of the pull request. The full suite runs once, by
# hand (`workflow_dispatch`), on the rebased and approved head just before the
# merge; a green run writes the verification of its tree to the registry
# (a Git note in `refs/notes/verified`, keyed by the tree). The push of `main`,
# a tag and the schedule always run the suite. The head of the merge queue
# (`queue/current`) runs it on its push too and is recorded like a green dispatch.
#
# Nothing here installs a tool from a private repository: the run needs the
# toolchain of the project and Git, nothing else.
#
# Add the setup of the toolchain of the project (language, package manager) where
# the comments say so: the runner starts with none.
name: CI

on:
  push:
    branches: [main, queue/current]
    tags: ["v*"]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

# One group per branch and event: a newer push cancels the outdated run of its
# branch, so it never waits for a stale validation. `main` is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  pr-form:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The body is untrusted text: it reaches the script through the environment,
      # never interpolated into the shell command.
      - name: Check the form of the pull request
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          python3 - <<'PY'
          import os, re, sys
          body = os.environ.get("PR_BODY", "")
          missing = [
              name
              for name in ("Why", "What changes", "How to check", "Notes")
              if not re.search(rf"^#+\s*\W*\s*{name}\b", body, re.I | re.M)
          ]
          for name in missing:
              print(f"::error::the body of the pull request has no '{name}' heading")
          sys.exit(1 if missing else 0)
          PY

  light:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up the toolchain
        uses: ./.github/actions/setup

      - name: Fast command
        run: |
          make check-fast

      - name: Audit commit subjects of the pull request
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          python3 - <<'PY'
          import os, re, subprocess, sys
          range_ = f"origin/{os.environ['BASE_REF']}..HEAD"
          subjects = subprocess.run(
              ["git", "log", "--no-merges", "--format=%s", range_],
              capture_output=True, text=True, check=True,
          ).stdout.splitlines()
          form = re.compile(r"^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([^)]+\))?!?: \S")
          bad = [s for s in subjects if len(s) > 72 or not form.match(s)]
          for subject in bad:
              print(f"::error::commit subject is not 'type(scope): subject' within 72 columns: {subject}")
          sys.exit(1 if bad else 0)
          PY

  full:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up the toolchain
        uses: ./.github/actions/setup

      - name: Full suite
        run: |
          make ci

  # After a green `workflow_dispatch` or a green push of `queue/current`: write
  # the verification of the checked-out tree to the registry. The only job that
  # can write. A failure here never fails the run: it only costs a replay.
  record:
    name: Record the verified tree
    needs: full
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/queue/current')) && needs.full.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GIT_AUTHOR_NAME: CI
      GIT_AUTHOR_EMAIL: ci@example.invalid
      GIT_COMMITTER_NAME: CI
      GIT_COMMITTER_EMAIL: ci@example.invalid
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Record and push the verification
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          tree="$(git rev-parse HEAD^{tree})"
          commit="$(git rev-parse HEAD)"
          at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git fetch --quiet origin +refs/notes/verified:refs/notes/verified || echo "No registry on the forge yet."
          git notes --ref=verified append -m "suite=ci-full result=pass source=ci run=${RUN_ID} commit=${commit} at=${at}" "${tree}"
          for attempt in 1 2 3; do
            if git push --quiet origin refs/notes/verified:refs/notes/verified; then
              echo "Verification recorded on the forge."
              exit 0
            fi
            # A race with another run: merge its notes (union) and try again.
            if [ "${attempt}" -eq 3 ]; then break; fi
            git fetch --quiet origin +refs/notes/verified:refs/notes/verified-incoming
            git notes --ref=verified merge -s union refs/notes/verified-incoming
            git update-ref -d refs/notes/verified-incoming
          done
          echo "::warning::The verification was not recorded; main will replay the suite."
