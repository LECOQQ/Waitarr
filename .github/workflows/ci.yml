name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    name: Check (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every version pyproject.toml supports, as in qbit-ops. Renovate
        # does not read matrix values: add a Python here by hand.
        python-version: ["3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Run CI
        run: make ci

      - name: Scan for secrets
        run: make secrets

  integration:
    name: Integration (real qBittorrent)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"

      - uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Install
        run: poetry install --no-interaction --no-ansi

      - name: Disposable-container suite
        run: make test-docker

      - name: End-to-end with the built image
        run: make check-image

  image:
    name: Image (not pushed; arm64 on main only)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v7

      # arm64 needs emulation and is slow: pull requests build amd64 only;
      # main and the release (publish-container) build both.
      - uses: docker/setup-qemu-action@v4
        if: github.event_name != 'pull_request'

      - uses: docker/setup-buildx-action@v4

      - name: Build the image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: false
          build-args: |
            REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
