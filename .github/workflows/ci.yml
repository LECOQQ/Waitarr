# Two-tier CI for a GitHub project, written by `ci init`.
#
# A pull request runs the light jobs only: the fast command of the project, the
# commit subjects and the form of the pull request. The full suite runs once, by
# hand (`workflow_dispatch`), on the rebased and approved head just before the
# merge; a green run writes the verification of its tree to the registry
# (a Git note in `refs/notes/verified`, keyed by the tree). The push of `main`,
# a tag and the schedule always run the suite. The head of the merge queue
# (`queue/current`) runs it on its push too and is recorded like a green dispatch.
#
# Nothing here installs a tool from a private repository: the run needs the
# toolchain of the project and Git, nothing else.
#
# Add the setup of the toolchain of the project (language, package manager) where
# the comments say so: the runner starts with none.
name: CI

on:
  push:
    branches: [main, queue/current]
    tags: ["v*"]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

# One group per branch and event: a newer push cancels the outdated run of its
# branch, so it never waits for a stale validation. `main` is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  pr-form:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The body is untrusted text: it reaches the script through the environment,
      # never interpolated into the shell command.
      - name: Check the form of the pull request
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          python3 - <<'PY'
          import os, re, sys
          # A bot writes its own body: exempt by its login, given by the forge, never by its
          # branch name or by what the body says.
          author = os.environ.get("PR_AUTHOR", "")
          if author.lower() in {"dependabot[bot]", "github-actions[bot]", "renovate[bot]"}:
              print(f"::notice::pull request from the bot {author}: no form required")
              sys.exit(0)
          body = os.environ.get("PR_BODY", "")
          missing = [
              name
              for name in ("Why", "What changes", "How to check", "Notes")
              if not re.search(rf"^#+\s*\W*\s*{name}\b", body, re.I | re.M)
          ]
          for name in missing:
              print(f"::error::the body of the pull request has no '{name}' heading")
          sys.exit(1 if missing else 0)
          PY

  light:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up the toolchain
        uses: ./.github/actions/setup

      - name: Fast command
        run: |
          make check-fast

      - name: Audit commit subjects of the pull request
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          python3 - <<'PY'
          import os, re, subprocess, sys
          range_ = f"origin/{os.environ['BASE_REF']}..HEAD"
          subjects = subprocess.run(
              ["git", "log", "--no-merges", "--format=%s", range_],
              capture_output=True, text=True, check=True,
          ).stdout.splitlines()
          form = re.compile(r"^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([^)]+\))?!?: \S")
          bad = [s for s in subjects if len(s) > 72 or not form.match(s)]
          for subject in bad:
              print(f"::error::commit subject is not 'type(scope): subject' within 72 columns: {subject}")
          sys.exit(1 if bad else 0)
          PY

  # Secret scan of the commits of the pull request. The release archive is pinned
  # by the sha256 its release publishes (`gitleaks_<version>_checksums.txt`) and
  # checked before it is unpacked: no container, no third-party action. gitleaks
  # reads the `.gitleaks.toml` at the root of the project when there is one, the
  # default rules otherwise.
  gitleaks:
    name: Secret scan
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "${RUNNER_TEMP}/${archive}" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          actual="$(sha256sum "${RUNNER_TEMP}/${archive}" | cut -d' ' -f1)"
          if [ "${actual}" != "${GITLEAKS_SHA256}" ]; then
            echo "::error::gitleaks ${GITLEAKS_VERSION}: sha256 ${actual} is not the pinned one"
            exit 1
          fi
          mkdir "${RUNNER_TEMP}/gitleaks"
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}/gitleaks" gitleaks

      - name: Scan the commits of the pull request
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          # gitleaks exits 0 with "0 commits scanned" when the range cannot be read.
          git rev-parse --verify --quiet "origin/${BASE_REF}^{commit}" >/dev/null || { echo "::error::origin/${BASE_REF} is not readable: nothing to scan"; exit 1; }
          "${RUNNER_TEMP}/gitleaks/gitleaks" git --no-banner --redact --log-opts "origin/${BASE_REF}..HEAD" .

  # Lint of the workflows of the project (`.github/workflows`):
  # actionlint for the syntax, zizmor for the security. Each release archive is pinned
  # by the sha256 its release publishes and checked before it is unpacked: no
  # container, no third-party action. zizmor runs offline (no token on the runner).
  workflows:
    name: Lint the workflows
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ACTIONLINT_VERSION: "1.7.12"
      ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
      ZIZMOR_VERSION: "1.33.1"
      ZIZMOR_SHA256: "3e6a301c7a820a2501915f5a9de8c0486da82bdec7965f068477538a98743d43"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install actionlint and zizmor
        run: |
          fetch() {
            curl -sSfL -o "${RUNNER_TEMP}/$1" "$2"
            actual="$(sha256sum "${RUNNER_TEMP}/$1" | cut -d' ' -f1)"
            if [ "${actual}" != "$3" ]; then
              echo "::error::$1: sha256 ${actual} is not the pinned one"
              exit 1
            fi
          }
          mkdir "${RUNNER_TEMP}/lint"
          actionlint="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          fetch "${actionlint}" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${actionlint}" "${ACTIONLINT_SHA256}"
          tar -xzf "${RUNNER_TEMP}/${actionlint}" -C "${RUNNER_TEMP}/lint" actionlint
          zizmor="zizmor-x86_64-unknown-linux-gnu.tar.gz"
          fetch "${zizmor}" "https://github.com/zizmorcore/zizmor/releases/download/v${ZIZMOR_VERSION}/${zizmor}" "${ZIZMOR_SHA256}"
          tar -xzf "${RUNNER_TEMP}/${zizmor}" -C "${RUNNER_TEMP}/lint" zizmor

      - name: Lint the workflows
        run: |
          mapfile -t files < <(find .github/workflows -type f \( -name '*.yml' -o -name '*.yaml' \) 2>/dev/null | sort)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::notice::No workflow to lint."
            exit 0
          fi
          status=0
          "${RUNNER_TEMP}/lint/actionlint" "${files[@]}" || status=1
          "${RUNNER_TEMP}/lint/zizmor" --offline --no-progress "${files[@]}" || status=1
          exit "${status}"

  full:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up the toolchain
        uses: ./.github/actions/setup

      - name: Full suite
        run: |
          make ci

  # After a green `workflow_dispatch` or a green push of `queue/current`: write
  # the verification of the checked-out tree to the registry. The only job that
  # can write. A failure here never fails the run: it only costs a replay.
  record:
    name: Record the verified tree
    needs: full
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/queue/current')) && needs.full.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GIT_AUTHOR_NAME: CI
      GIT_AUTHOR_EMAIL: ci@example.invalid
      GIT_COMMITTER_NAME: CI
      GIT_COMMITTER_EMAIL: ci@example.invalid
    steps:
      # The credentials stay: this job pushes the registry.
      - name: Checkout repository # zizmor: ignore[artipacked]
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Record and push the verification
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          tree="$(git rev-parse "HEAD^{tree}")"
          commit="$(git rev-parse HEAD)"
          at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git fetch --quiet origin +refs/notes/verified:refs/notes/verified || echo "No registry on the forge yet."
          git notes --ref=verified append -m "suite=ci-full result=pass source=ci run=${RUN_ID} commit=${commit} at=${at}" "${tree}"
          for attempt in 1 2 3; do
            if git push --quiet origin refs/notes/verified:refs/notes/verified; then
              echo "Verification recorded on the forge."
              exit 0
            fi
            # A race with another run: merge its notes (union) and try again.
            if [ "${attempt}" -eq 3 ]; then break; fi
            git fetch --quiet origin +refs/notes/verified:refs/notes/verified-incoming
            git notes --ref=verified merge -s union refs/notes/verified-incoming
            git update-ref -d refs/notes/verified-incoming
          done
          echo "::warning::The verification was not recorded; main will replay the suite."
