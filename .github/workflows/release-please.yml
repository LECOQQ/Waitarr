name: Release Please

on:
  push:
    branches:
      - main

jobs:
  release-please:
    name: Prepare release
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write
      # Lets this job dispatch the publish workflows below.
      actions: write

    steps:
      - name: Release Please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Only a merged release PR reaches these steps. Events raised by
      # GITHUB_TOKEN start no workflow, except `workflow_dispatch`.
      - name: Publish the release container to GHCR
        if: steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run publish-container.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$GITHUB_REF_NAME" \
            -f tag="${{ steps.release.outputs.tag_name }}"
