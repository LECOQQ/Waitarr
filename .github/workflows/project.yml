# What is specific to Waitarr: the Python matrix, the secret scan, the
# disposable-container suite and the image build. ci.yml is the two-tier CI of
# the harness, written by `agent-harness ci init` (regenerate it with
# `agent-harness ci init --aside` and compare): nothing project-specific goes
# there.
name: Project

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    name: Check (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every version pyproject.toml supports, as in qbit-ops. Renovate
        # does not read matrix values: add a Python here by hand.
        python-version: ["3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}

      - uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263 # v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Run CI
        run: make ci

      - name: Scan for secrets
        run: make secrets

  integration:
    name: Integration (real qBittorrent)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.15"

      - uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263 # v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Install
        run: poetry install --no-interaction --no-ansi

      - name: Disposable-container suite
        run: make test-docker

      - name: End-to-end with the built image
        run: make check-image

  image:
    name: Image (not pushed; arm64 on main only)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # The Dockerfile linter, a pinned release binary checked against its
      # published sha256 before it runs: no container, no third-party action.
      - name: Lint the Dockerfile
        env:
          HADOLINT_VERSION: "2.15.1"
          HADOLINT_SHA256: "c7187db94eeeeca956519a6af171adc31453941a1e777961f6e680f697c8c507"
        run: |
          curl -sSfL -o "${RUNNER_TEMP}/hadolint" "https://github.com/hadolint/hadolint/releases/download/v${HADOLINT_VERSION}/hadolint-linux-x86_64"
          echo "${HADOLINT_SHA256}  ${RUNNER_TEMP}/hadolint" | sha256sum -c -
          chmod +x "${RUNNER_TEMP}/hadolint"
          "${RUNNER_TEMP}/hadolint" Dockerfile

      # arm64 needs emulation and is slow: pull requests build amd64 only;
      # main and the release (publish-container) build both.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
        if: github.event_name != 'pull_request'

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: false
          build-args: |
            REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The scan reads the image the CI just built (amd64, loaded into the
      # local daemon, from the cache of the build above), never a published
      # one. Trivy is a pinned release binary checked against its published
      # sha256: no container, no third-party action. A fixable HIGH or
      # CRITICAL vulnerability, in the application dependencies or in the
      # OS packages of the image, fails the job.
      - name: Load the image for the scan
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: waitarr:scan
          build-args: |
            REVISION=${{ github.sha }}
          cache-from: type=gha

      - name: Scan the image
        env:
          TRIVY_VERSION: "0.76.2"
          TRIVY_SHA256: "bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf"
        run: |
          archive="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -sSfL -o "${RUNNER_TEMP}/${archive}" "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/${archive}"
          echo "${TRIVY_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum -c -
          mkdir "${RUNNER_TEMP}/trivy"
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}/trivy" trivy
          scan="${RUNNER_TEMP}/trivy/trivy image --no-progress --severity HIGH,CRITICAL --ignore-unfixed"
          ${scan} --pkg-types library --exit-code 1 waitarr:scan
          ${scan} --pkg-types os --exit-code 1 waitarr:scan

  provenance:
    name: Commit provenance (pull request)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # The commits of the pull request, read from the checkout: the hook that
      # audits them locally can be skipped, this cannot.
      - name: Audit the commits of the pull request
        env:
          BASE_REF: ${{ github.base_ref }}
        run: python3 scripts/check_commit_provenance.py --range "origin/${BASE_REF}..HEAD"
