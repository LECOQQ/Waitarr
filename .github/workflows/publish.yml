name: Publish to PyPI

# Ready, not wired: publishing to PyPI is the maintainer's decision. Once
# the Trusted Publisher is configured on PyPI, dispatch it by hand, or
# from release-please.yml the way publish-container.yml is.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (vX.Y.Z) to build, verify and publish."
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/waitarr
    permissions:
      # Trusted Publishing: no PyPI token is stored anywhere.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.15"

      - uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263 # v1

      - name: Verify the declared version agrees with the release tag
        env:
          TAG: ${{ inputs.tag }}
        run: python3 scripts/check_version_sync.py --tag "$TAG"

      - name: Build wheel and sdist
        run: poetry build

      - name: Validate the built artefacts
        run: |
          python3 -m pip install --upgrade twine
          python3 -m twine check --strict dist/*

      - name: Verify the entrypoint works from the built wheel
        run: |
          python3 -m venv /tmp/entrypoint-check
          /tmp/entrypoint-check/bin/python -m pip install --quiet dist/*.whl
          /tmp/entrypoint-check/bin/waitarr --version

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
